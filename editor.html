<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Studio CMS — Visual Content Editor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0B0A; color: #F4F1EA; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-50 flex items-center justify-between border-b border-[#262522] bg-[#141412] px-6 py-4">
    <div class="flex items-center gap-3">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#C89D66] font-serif text-lg font-bold text-black">P</span>
      <div>
        <h1 class="text-sm font-semibold tracking-tight">Portfolio Studio CMS</h1>
        <p class="font-mono text-[10px] text-[#9A968E]">Local In-Browser Visual Editor</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="downloadUpdatedJson()" class="inline-flex items-center gap-1.5 rounded-full bg-[#C89D66] px-4 py-2 text-xs font-semibold text-black hover:opacity-95 shadow-lg">
        <i data-lucide="download" class="h-3.5 w-3.5"></i>
        <span>Download content.json</span>
      </button>

      <a href="index.html" class="inline-flex items-center gap-1 rounded-full border border-[#262522] px-3.5 py-2 font-mono text-xs text-[#9A968E] hover:text-white">
        <span>View Live Site</span>
        <i data-lucide="arrow-up-right" class="h-3 w-3 text-[#C89D66]"></i>
      </a>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="mx-auto max-w-7xl px-6 pt-8">
    <div id="status-toast" class="hidden mb-6 rounded-xl border border-emerald-500/30 bg-emerald-950/40 p-3 text-xs font-mono text-emerald-300 flex items-center justify-between">
      <span id="status-msg">Changes saved locally!</span>
      <button onclick="document.getElementById('status-toast').classList.add('hidden')" class="underline">Dismiss</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- LEFT SIDEBAR: PROJECTS LIST -->
      <aside class="lg:col-span-4 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-mono text-xs uppercase tracking-widest text-[#9A968E]">PROJECTS (<span id="proj-count">0</span>)</h2>
          <button onclick="addNewProject()" class="inline-flex items-center gap-1 rounded-full bg-[#C89D66] px-3 py-1 text-xs font-semibold text-black">
            <i data-lucide="plus" class="h-3.5 w-3.5"></i>
            <span>Add Study</span>
          </button>
        </div>

        <div id="project-list" class="space-y-2.5">
          <!-- Projects list items injected by JavaScript -->
        </div>
      </aside>

      <!-- RIGHT COLUMN: ACTIVE PROJECT EDITOR -->
      <main class="lg:col-span-8">
        <div id="editor-form-card" class="rounded-2xl border border-[#262522] bg-[#141412] p-6 space-y-6">
          <div class="flex items-center justify-between border-b border-[#262522] pb-4">
            <div>
              <span class="font-mono text-[10px] text-[#C89D66] uppercase">PROJECT DETAILS</span>
              <h2 id="active-title-header" class="font-serif text-3xl text-white">Select a Project</h2>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="duplicateActiveProject()" class="rounded-full border border-[#262522] bg-[#1B1B18] px-3 py-1.5 text-xs text-[#9A968E] hover:text-white flex items-center gap-1">
                <i data-lucide="copy" class="h-3.5 w-3.5"></i> <span>Duplicate</span>
              </button>
              <button onclick="deleteActiveProject()" class="rounded-full border border-red-900/40 bg-red-950/30 px-3 py-1.5 text-xs text-red-300 hover:bg-red-950/60 flex items-center gap-1">
                <i data-lucide="trash-2" class="h-3.5 w-3.5"></i> <span>Delete</span>
              </button>
            </div>
          </div>

          <!-- INPUT FORM -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-mono text-[11px] uppercase text-[#9A968E]">Project Title</label>
              <input id="input-title" type="text" oninput="updateActiveField('title', this.value)" class="mt-1 w-full rounded-lg border border-[#262522] bg-[#0B0B0A] px-3 py-2 text-sm text-white focus:border-[#C89D66] focus:outline-none" />
            </div>
            <div>
              <label class="block font-mono text-[11px] uppercase text-[#9A968E]">Category</label>
              <select id="input-category" onchange="updateActiveField('category', this.value)" class="mt-1 w-full rounded-lg border border-[#262522] bg-[#0B0B0A] px-3 py-2 text-sm text-white">
                <option value="3D & Motion">3D & Motion</option>
                <option value="Visual Identity">Visual Identity</option>
                <option value="Lighting & Lookdev">Lighting & Lookdev</option>
                <option value="Experimental">Experimental</option>
                <option value="Photography">Photography</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="block font-mono text-[11px] uppercase text-[#9A968E]">Subtitle / Hook</label>
              <input id="input-subtitle" type="text" oninput="updateActiveField('subtitle', this.value)" class="mt-1 w-full rounded-lg border border-[#262522] bg-[#0B0B0A] px-3 py-2 text-sm text-white" />
            </div>
            <div>
              <label class="block font-mono text-[11px] uppercase text-[#9A968E]">Year</label>
              <input id="input-year" type="text" oninput="updateActiveField('year', this.value)" class="mt-1 w-full rounded-lg border border-[#262522] bg-[#0B0B0A] px-3 py-2 text-sm text-white" />
            </div>
            <div>
              <label class="block font-mono text-[11px] uppercase text-[#9A968E]">Tools (comma-separated)</label>
              <input id="input-tools" type="text" oninput="updateActiveField('tools', this.value.split(',').map(s=>s.trim()))" class="mt-1 w-full rounded-lg border border-[#262522] bg-[#0B0B0A] px-3 py-2 text-sm text-white" />
            </div>
            <div class="sm:col-span-2">
              <label class="block font-mono text-[11px] uppercase text-[#9A968E]">Overview Summary</label>
              <textarea id="input-summary" rows="3" oninput="updateActiveField('summary', this.value)" class="mt-1 w-full rounded-lg border border-[#262522] bg-[#0B0B0A] p-3 text-sm text-white"></textarea>
            </div>
          </div>

          <!-- IMAGE UPLOADER WITH AUTOMATIC WEBP CONVERSION -->
          <div class="border-t border-[#262522] pt-6 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="font-mono text-xs uppercase text-[#C89D66]">COVER IMAGE</h3>
                <p class="text-xs text-[#9A968E]">Choose an image from your computer. It compresses to high-speed WebP automatically.</p>
              </div>
              <label class="cursor-pointer inline-flex items-center gap-1.5 rounded-full bg-[#C89D66] px-4 py-1.5 text-xs font-semibold text-black">
                <i data-lucide="upload" class="h-3.5 w-3.5"></i>
                <span>Upload Image</span>
                <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="hidden" />
              </label>
            </div>

            <div class="aspect-video w-full max-w-md overflow-hidden rounded-xl border border-[#262522] bg-[#0B0B0A]">
              <img id="preview-cover" src="images/ui/aperture.webp" alt="Cover Preview" class="h-full w-full object-cover" />
            </div>
          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- CLIENT CMS SCRIPT -->
  <script>
    let cmsData = null;
    let selectedId = null;

    async function initCMS() {
      const local = localStorage.getItem('parth_portfolio_cms_draft_v2');
      if (local) {
        try { cmsData = JSON.parse(local); } catch(e){}
      }
      if (!cmsData) {
        try {
          const res = await fetch('content.json');
          if (res.ok) cmsData = await res.json();
        } catch(e){}
      }
      if (!cmsData) cmsData = window.opener?.DEFAULT_DATA || null;

      selectedId = cmsData.projects[0]?.id || null;
      renderCMS();
    }

    function renderCMS() {
      document.getElementById('proj-count').innerText = cmsData.projects.length;

      document.getElementById('project-list').innerHTML = cmsData.projects.map((p, idx) => `
        <div onclick="selectProject('${p.id}')" class="cursor-pointer rounded-xl border p-3 transition-all ${selectedId === p.id ? 'border-[#C89D66] bg-[#1B1B18]' : 'border-[#262522] bg-[#141412] hover:border-[#383734]'}">
          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-white">${p.title}</span>
            <span class="font-mono text-[10px] text-[#9A968E]">${p.year}</span>
          </div>
          <div class="mt-1 flex justify-between font-mono text-[10px] text-[#9A968E]">
            <span>${p.category}</span>
            ${p.featured ? '<span class="text-[#C89D66]">★ Featured</span>' : ''}
          </div>
        </div>
      `).join('');

      const active = cmsData.projects.find(p => p.id === selectedId) || cmsData.projects[0];
      if (active) {
        document.getElementById('active-title-header').innerText = active.title;
        document.getElementById('input-title').value = active.title || '';
        document.getElementById('input-category').value = active.category || '3D & Motion';
        document.getElementById('input-subtitle').value = active.subtitle || '';
        document.getElementById('input-year').value = active.year || '';
        document.getElementById('input-tools').value = (active.tools || []).join(', ');
        document.getElementById('input-summary').value = active.summary || '';
        document.getElementById('preview-cover').src = active.thumbnail;
      }

      lucide.createIcons();
    }

    function selectProject(id) {
      selectedId = id;
      renderCMS();
    }

    function updateActiveField(field, value) {
      const p = cmsData.projects.find(x => x.id === selectedId);
      if (!p) return;
      p[field] = value;
      saveDraft();
    }

    function addNewProject() {
      const newP = {
        id: "proj-" + Date.now(),
        slug: "new-study-" + (cmsData.projects.length + 1),
        title: "Untitled Visual Study",
        subtitle: "3D Lookdev & Form Exploration",
        category: "3D & Motion",
        year: "2026",
        tools: ["Blender", "After Effects"],
        featured: false,
        thumbnail: "images/projects/tissot/thumbnail.webp",
        summary: "Description of the visual project, lighting setup, and materials.",
        gallery: []
      };
      cmsData.projects.unshift(newP);
      selectedId = newP.id;
      saveDraft();
      renderCMS();
    }

    function duplicateActiveProject() {
      const active = cmsData.projects.find(p => p.id === selectedId);
      if (!active) return;
      const copy = JSON.parse(JSON.stringify(active));
      copy.id = "proj-" + Date.now();
      copy.title += " (Copy)";
      cmsData.projects.push(copy);
      selectedId = copy.id;
      saveDraft();
      renderCMS();
    }

    function deleteActiveProject() {
      if (cmsData.projects.length <= 1) {
        alert("You must have at least one project in your portfolio.");
        return;
      }
      cmsData.projects = cmsData.projects.filter(p => p.id !== selectedId);
      selectedId = cmsData.projects[0].id;
      saveDraft();
      renderCMS();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          // Canvas WebP Compression
          const canvas = document.createElement('canvas');
          const maxDim = 1600;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim)/w); w = maxDim; }
            else { w = Math.round((w * maxDim)/h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const webpDataUrl = canvas.toDataURL('image/webp', 0.85);

          const active = cmsData.projects.find(p => p.id === selectedId);
          if (active) {
            active.thumbnail = webpDataUrl;
            saveDraft();
            renderCMS();
            showToast("Image optimized to WebP and set as cover!");
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveDraft() {
      localStorage.setItem('parth_portfolio_cms_draft_v2', JSON.stringify(cmsData));
    }

    function downloadUpdatedJson() {
      const blob = new Blob([JSON.stringify(cmsData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'content.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast("content.json downloaded! Replace the old content.json in your folder.");
    }

    function showToast(msg) {
      document.getElementById('status-msg').innerText = msg;
      document.getElementById('status-toast').classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', initCMS);
  </script>
</body>
</html>
