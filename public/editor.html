<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Manage your portfolio and export website updates."><meta name="robots" content="noindex,nofollow"><title>Portfolio manager</title><style>
:root{color-scheme:light;--accent:#a82431;--line:#dedee4;--muted:#636471}*{box-sizing:border-box}body{margin:0;background:#f6f6f8;color:#202129;font:15px/1.5 system-ui}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#191a20;color:white;padding:28px 18px;display:flex;flex-direction:column;gap:9px}aside h1{font-size:20px;margin:0 10px 25px}aside button{background:transparent;color:#c8c8d0;text-align:left;border:0}aside button.active{background:#35353e;color:white}aside small{margin-top:auto;color:#b5b5c0;padding:12px}main{margin-left:220px;max-width:1250px;padding:36px 40px 110px}h2{font-size:30px;letter-spacing:-.6px;margin:0 0 8px}h3{font-size:19px;margin:0 0 18px}p{color:var(--muted)}button,.upload{font:inherit;cursor:pointer;background:white;border:1px solid var(--line);border-radius:7px;padding:10px 16px;color:inherit}button:hover,.upload:hover{border-color:#898992}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}button.danger{color:#a82431}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #df9da4;outline-offset:2px}input,textarea,select{width:100%;padding:11px;border:1px solid #cfcfd7;background:white;color:#202129;border-radius:6px;font:inherit}textarea{min-height:95px;resize:vertical}input[type=checkbox]{width:20px;height:20px}label{display:block;margin-bottom:6px;font-weight:550}.field{margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;margin:24px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>select{width:auto;flex:1}.hint,small{color:var(--muted);font-size:13px}.hint{margin:8px 0}.actions{position:fixed;bottom:0;left:220px;right:0;background:#ffffffed;border-top:1px solid var(--line);padding:15px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}#status{margin:16px 0;padding:12px 16px;background:#eaeaf0;border-radius:6px}#status.error{background:#ffe5e8;color:#8b1724}.preview{max-width:340px;max-height:210px;object-fit:contain;border-radius:6px;background:#f0f0f3;margin:12px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:20px}.tile{border:1px solid var(--line);border-radius:8px;padding:12px;overflow-wrap:anywhere}.tile img{width:100%;height:130px;object-fit:cover;border-radius:5px}.tile input{margin:5px 0}.tile button{padding:5px 9px;font-size:13px}.stat{font-size:32px;font-weight:650}.badge{font-size:12px;border-radius:20px;background:#ececf1;padding:4px 9px}a{color:var(--accent)}video,iframe{max-width:100%;width:100%;aspect-ratio:16/9;border:0;border-radius:8px}.video-preview{max-width:640px;margin-top:16px}details{margin-top:20px}summary{cursor:pointer;font-weight:600}.empty{padding:22px;text-align:center;border:1px dashed #cfcfd7;border-radius:8px;color:var(--muted)}@media(max-width:760px){aside{width:155px;padding:20px 8px}aside h1{font-size:16px}aside button{padding:10px}main{margin-left:155px;padding:24px 18px 185px}.actions{left:155px;padding:12px}.grid{grid-template-columns:1fr}.card{padding:17px}h2{font-size:25px}}
</style></head><body><aside><h1>Portfolio<br><small>PERSONAL EDITOR</small></h1><nav id="nav"></nav><small>Save → Download → Upload to GitHub</small></aside><main><h2 id="title">Loading your portfolio…</h2><p id="intro"></p><div id="status" role="status">Opening editor content.</div><div id="view"></div></main><footer class="actions" id="actions"></footer><script type="module" src="./editor/app.js"></script></body></html>
